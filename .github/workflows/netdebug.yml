# One-off: is it the size of the TLS ClientHello (post-quantum key share) that dies between GitHub and matheel.app?
name: netdebug
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          openssl version; curl --version | head -n 1
          for i in 1 2 3; do
            echo "small hello (X25519): $(curl -s -o /dev/null -m 20 --curves X25519 -w '%{http_code}' https://matheel.app/health)"
            echo "large hello (default, PQ): $(curl -s -o /dev/null -m 20 -w '%{http_code}' https://matheel.app/health)"
            echo "tls1.2: $(curl -s -o /dev/null -m 20 --tls-max 1.2 -w '%{http_code}' https://matheel.app/health)"
          done
          ip -o link show | awk '{print $2, $4, $5}'
